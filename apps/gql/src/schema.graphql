# ─────────────────────────────────────────────────────────────
# Step 2 — 화면이 원하는 모양에서 출발한 스키마
#
# 설계 원칙:
#  1) REST 응답을 그대로 옮기지 않는다. 4개 화면(홈 피드 / 책 상세 /
#     유저 프로필 / 검색)이 각각 "단일 query"로 그려지는 모양이 출발점.
#  2) 관계는 외래키(bookId/authorId)가 아니라 객체로 노출한다.
#     → review { book { title } author { name } } 가 한 query로 끝난다.
#  3) non-null(!)은 "BE가 반드시 채워준다"는 약속. viewer 가시성으로
#     가려질 수 있는 필드는 일부러 nullable로 둔다(null = 거부의 표현).
#  4) 페이지네이션은 단순 Connection({ reviews, nextCursor })으로 통일.
# ─────────────────────────────────────────────────────────────

# Node: 모든 엔티티가 가지는 전역 고유 id 계약.
interface Node {
  id: ID!
}

# ── Book ──────────────────────────────────────────────────────
type Book implements Node {
  id: ID!
  title: String!
  author: String!          # 저자명(문자열). 유저(User)와는 다른 개념이라 그대로 둔다.
  coverUrl: String         # 표지는 없을 수 있다 → nullable
  description: String       # 상세 화면에서만 쓰는 큰 텍스트 → nullable
  isbn: String!
  publishedAt: String!
  publisher: String!
  category: String!
  pageCount: Int!
  averageRating: Float!     # REST가 항상 집계해 주므로 non-null 약속
  reviewCount: Int!

  # 책 상세 화면의 리뷰 목록. 수백~수천 개로 열려 있어 페이지네이션 → Connection.
  reviews(first: Int, after: String): ReviewConnection!
}

# ── User ──────────────────────────────────────────────────────
type User implements Node {
  id: ID!
  name: String!
  avatarUrl: String        # 없을 수 있음
  bio: String              # 없을 수 있음
  joinedAt: String!
  role: Role!
  followerCount: Int!
  followingCount: Int!
  reviewCount: Int!

  email: String
  bannedAt: String # bannedAt: admin 만 볼 수 있는 운영 필드. 일반 유저에겐 null.
  followedByMe: Boolean!
  reviews(first: Int, after: String): ReviewConnection!
}

enum Role {
  user
  admin
}

# ── Review ────────────────────────────────────────────────────
type Review implements Node {
  id: ID!
  # 외래키 대신 관계 객체로 노출 (REST 의 bookId/authorId 를 대체)
  book: Book!
  author: User!
  rating: Int!
  content: String          # 본문이 비어있는 리뷰(별점만)도 허용 → nullable
  likeCount: Int!
  commentCount: Int!
  createdAt: String!
  updatedAt: String!

  # ── viewer-derived 필드 ──
  # "내가 이 리뷰에 좋아요를 눌렀나". 비로그인이면 false → Boolean!.
  likedByMe: Boolean!

  # ── viewer 의존 가시성 필드 ──
  # draftContent: 작성자 본인만. 남이 보면 null.
  draftContent: String
  # reportCount: admin 만. 일반 유저에겐 null.
  reportCount: Int

  # 리뷰의 댓글. 보통 적은 수라 단순 list 로 둔다.
  # (열려 있고 많아지면 CommentConnection 으로 승격하면 된다.)
  comments: [Comment!]!
}

type Comment implements Node {
  id: ID!
  review: Review!
  author: User!
  content: String!
  createdAt: String!
}

# ── 페이지네이션 (Connection) ────────────────────────────
type ReviewConnection {
  reviews: [Review!]!
  nextCursor: String
}

type BookConnection {
  books: [Book!]!
  nextCursor: String
}

# ── Query (root operation type) ───────────────────────────────
type Query {
  # 홈 피드 화면: "내가 팔로우한 사람들의 최근 리뷰". 무한 스크롤 → Connection.
  homeFeed(first: Int, after: String): ReviewConnection!

  # 책 상세 화면
  book(id: ID!): Book

  # 유저 프로필 화면
  user(id: ID!): User

  search(query: String!, first: Int, after: String): BookConnection!
}

# ── Mutation ───────────────────
# 관습: 입력은 input 타입, 출력은 payload 타입으로 분리한다.
# 모델 타입(Review!)을 input 으로 받지 않는다.
#
# 출력은 "union payload" 로 둔다(설계 근거는 README 참고):
#  - 잘못된 입력 / 권한 없음 / 미인증 / 대상 없음은 "예상 가능한 비즈니스 실패"다.
#    throw 로 errors[] 에 흘리지 않고, 실패도 결과의 한 종류로 보고
#    union 의 한 멤버(타입)로 표현한다. 클라이언트는 __typename 으로 분기.
#  - 진짜 예외(서버 장애 등)만 throw → errors[].
type Mutation {
  createReview(input: CreateReviewInput!): ReviewResult!
  updateReview(input: UpdateReviewInput!): ReviewResult!
  deleteReview(input: DeleteReviewInput!): DeleteReviewResult!

  likeReview(input: LikeReviewInput!): ReviewResult!
  unlikeReview(input: LikeReviewInput!): ReviewResult!

  followUser(input: FollowUserInput!): UserResult!
  unfollowUser(input: FollowUserInput!): UserResult!
}

input CreateReviewInput {
  bookId: ID!
  rating: Int!
  content: String
}
input UpdateReviewInput {
  reviewId: ID!
  rating: Int
  content: String
}
input DeleteReviewInput {
  reviewId: ID!
}
input LikeReviewInput {
  reviewId: ID!
}
input FollowUserInput {
  userId: ID!
}

# ── Mutation 결과: union payload ──────────────────────────────
# 모든 에러 멤버가 구현하는 공통 계약. 클라이언트가
#   ... on MutationError { message }
# 한 줄로 "어떤 실패든 메시지"를 받을 수 있어 일관성이 생긴다.
interface MutationError {
  message: String!
}
type InvalidInput implements MutationError { message: String! }     # 입력값/비즈니스 규칙 위반
type NotAuthenticated implements MutationError { message: String! } # 로그인 안 됨
type NotAuthorized implements MutationError { message: String! }    # 권한 없음(본인/admin 아님)
type NotFound implements MutationError { message: String! }         # 대상 리뷰/유저 없음

# 성공 멤버
type ReviewSuccess {
  review: Review!
}
type DeleteReviewSuccess {
  deletedReviewId: ID!
}
type UserSuccess {
  user: User!
}

# "성공 OR 예상 가능한 실패들" 중 하나. 클라이언트는 __typename 으로 분기.
union ReviewResult = ReviewSuccess | InvalidInput | NotAuthenticated | NotAuthorized | NotFound
union DeleteReviewResult =
    DeleteReviewSuccess
  | InvalidInput
  | NotAuthenticated
  | NotAuthorized
  | NotFound
union UserResult = UserSuccess | InvalidInput | NotAuthenticated | NotAuthorized | NotFound
